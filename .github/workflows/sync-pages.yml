name: Sync Forge Master Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-pages.yml'
      - 'scripts/sync_content.py'
      - 'scripts/publish_sync.sh'

permissions:
  contents: write
  pages: write

# Both writers share a lock and check out main AFTER acquiring it.
concurrency:
  group: forge-master-content-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify existing branch-based Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"
          python - <<'CHECK'
          import json, os
          from pathlib import Path
          pages = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pages.json').read_text())
          assert pages['build_type'] == 'legacy', 'Expected existing branch-based Pages deployment'
          assert pages['source'] == {'branch': 'main', 'path': '/'}, 'Unexpected Pages source'
          CHECK
      - name: Stage and validate complete snapshot
        run: python scripts/sync_content.py pages
      - name: Commit changed content and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_sync.sh index.html .nojekyll embedded-images companion-icons
