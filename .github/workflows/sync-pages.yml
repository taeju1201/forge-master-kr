name: Sync Forge Master V72 to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-pages.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest public planner
        shell: bash
        run: |
          set -euo pipefail
          base="https://forge-master-kr.menam1407.chatgpt.site"
          ua="Mozilla/5.0 (GitHub Pages sync)"
          curl -fsSL -A "$ua" -c /tmp/fm-cookies "$base/forge-master.html" -o index.html
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          paths = set(re.findall(r'embedded-images/[A-Za-z0-9._-]+', html))
          for kind, count in (("skills", 64), ("pets", 64), ("mounts", 16)):
              for asc in range(4):
                  for index in range(count):
                      paths.add(f"companion-icons/{kind}-{asc}-{index:02d}.png")
          pathlib.Path("/tmp/fm-paths").write_text("\n".join(sorted(paths)), encoding="utf-8")
          print(f"queued {len(paths)} image assets")
          PY
          export base ua
          download_asset() {
            rel="$1"
            mkdir -p "$(dirname "$rel")"
            curl -fsSL --retry 3 -A "$ua" -b /tmp/fm-cookies -e "$base/" "$base/$rel" -o "$rel"
          }
          export -f download_asset
          xargs -P 16 -I{} bash -c 'download_asset "$1"' _ {} < /tmp/fm-paths
          touch .nojekyll
      - name: Publish synced files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V72 GitHub Pages 동기화"
            git push
          fi
