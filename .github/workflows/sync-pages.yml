name: Check Forge Master Pages source

# The historical V72 source is not compatible with the current profile app.
# Keep it as an explicit diagnostic until its storage schema and dependencies
# have been migrated. Never replace the live UI merely because images decode.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-master-pages-source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Check source compatibility and snapshot without publishing
        run: python scripts/sync_content.py pages --check-only
