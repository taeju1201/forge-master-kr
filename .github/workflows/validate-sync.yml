name: Validate synchronization
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'index.html'
      - 'js/**'
      - 'data/releases/**'
      - 'assets/releases/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'index.html'
      - 'js/**'
      - 'data/releases/**'
      - 'assets/releases/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - name: Test profile migration
        run: node tests/test_profile_migration.cjs
      - name: Test game math
        run: node tests/test_game_math.cjs
      - run: bash -n scripts/publish_sync.sh
