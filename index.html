evel=lv;save();r();toast('요정 적용됨')};r()}
function warTaskKo(task){if(K.warTaskKo[task])return K.warTaskKo[task];let rar=Object.entries({Common:'일반',Rare:'희귀',Epic:'에픽',Legendary:'전설',Ultimate:'궁극',Mythic:'신화'}).find(([en])=>task.includes(en));let rk=rar?.[1]||'';if(task.startsWith('Summon')&&task.endsWith('Skill'))return rk+' 스킬 소환';if(task.startsWith('Upgrade')&&task.endsWith('Skill'))return rk+' 스킬 강화';if(task.startsWith('Hatch')&&task.endsWith('Egg'))return rk+' 알 부화';if(task.startsWith('Merge')&&task.endsWith('Pet'))return rk+' 펫 합성';if(task.startsWith('Summon')&&task.endsWith('Mount'))return rk+' 탈것 소환';if(task.startsWith('Merge')&&task.endsWith('Mount'))return rk+' 탈것 합성';return sentence(task)}
async function renderWar(){
  let [days,tech,clanMap,maps,skillLib,items]=await Promise.all([
    cfg('GuildWarDayConfigLibrary.json'),
    cfg('GuildTechTreeUpgradeLibrary.json'),
    cfg('ClanTechTreeIconsMap.json',true),
    mappingLookups(),
    cfg('SkillLibrary.json'),
    allItems()
  ]);
  let p=profile(),day=1;
  const rarEn=['Common','Rare','Epic','Legendary','Ultimate','Mythic'];
  const rarIdx={Common:0,Rare:1,Epic:2,Legendary:3,Ultimate:4,Mythic:5};
  const forgeAge={Primitive:0,Medieval:1,EarlyModern:2,Modern:3,Space:4,Interstellar:5,Multiverse:6,Quantum:7,Underworld:8,Divine:9};
  function dayTasks(d){return(days[String(d-1)]?.Tasks||[]).map(t=>({task:t.Task,base:n(t.Rewards?.find(r=>r.$type==='WarPointsReward')?.Amount),tech:K.warTechForTask(t.Task)}))}
  function lv(k){return Math.max(0,n(p.clanTech[k]))}
  function isInf(k){let d=tech[k]||{};return n(d.PointsPerInfiniteLevel)>0&&n(d.ValuePerInfiniteLevel)!==0}
  function bonus(k){let d=tech[k]||{},l=lv(k),cap=n(d.MaxLevel);return Math.min(l,cap)*n(d.ValuePerLevel)+Math.max(0,l-cap)*n(d.ValuePerInfiniteLevel)}
  function techCost(k){let d=tech[k]||{},l=lv(k),cap=n(d.MaxLevel);return Math.min(l,cap)*n(d.PointsPerLevel)+Math.max(0,l-cap)*n(d.PointsPerInfiniteLevel)}
  function countKey(d,t){return `${d}:${t}`}
  function cnt(d,t){return Math.max(0,n(p.warCounts[countKey(d,t)]))}
  function rowResult(d,x){let raw=cnt(d,x.task),unit=raw;if(x.task==='SpendCoinsOnForge')unit=Math.floor(raw/1000);let b=bonus(x.tech),db=bonus('WarPointsOnDay'+d),per=x.base*(1+b+db);return{raw,unit,b,db,per,total:Math.round(unit*per)}}
  function total(d){return dayTasks(d).reduce((a,x)=>a+rowResult(d,x).total,0)}
  function rarityOf(task){return rarEn.find(r=>task.includes(r))||''}
  function firstSkill(r){return Object.values(maps.skills).find(x=>skillLib[x.name]?.Rarity===r)}
  function firstPet(r){return Object.values(maps.pets).find(x=>x.rarity===r)}
  function firstMount(r){return Object.values(maps.mounts).find(x=>x.rarity===r)}
  function taskIcon(task,size=52){
    let r=rarityOf(task);
    if(task.startsWith('Hatch')&&task.endsWith('Egg')){
      let f=['Eggs.png','MegaEggs.png','UltraEggs.png','ApexEggs.png'][Math.max(0,Math.min(3,n(p.petAsc)))];
      return `<span class="sprite" style="${atlasStyle(f,rarIdx[r]??0,4,256,size)}"></span>`;
    }
    if((task.startsWith('Summon')||task.startsWith('Upgrade'))&&task.endsWith('Skill')){
      let x=firstSkill(r);return x?compSprite(x,'skills',p.skillAsc||0,size):gameIcon('SkillTicket',size);
    }
    if(task.startsWith('Merge')&&task.endsWith('Pet')){
      let x=firstPet(r);return x?compSprite(x,'pets',p.petAsc||0,size):gameIcon('PetKey',size);
    }
    if((task.startsWith('Summon')||task.startsWith('Merge'))&&task.endsWith('Mount')){
      let x=firstMount(r);return x?compSprite(x,'mounts',p.mountAsc||0,size):gameIcon('MountKey',size);
    }
    if(task==='UseHammerThiefDungeonKey')return gameIcon('HammerKey',size);
    if(task==='UseGhostTownDungeonKey')return gameIcon('SkillKey',size);
    if(task==='UseInvasionDungeonKey')return gameIcon('PetKey',size);
    if(task==='UseZombieInvasionDungeonKey')return gameIcon('PotionKey',size);
    if(task==='SpendCoinsOnForge')return gameIcon('Coin',size);
    if(task==='SpendGemOnForge')return gameIcon('GemSquare',size);
    if(task.startsWith('Finish')&&task.includes('TechTreeUpgrade'))return gameIcon('Potion',size);
    if(task.startsWith('Forge')){
      let key=Object.keys(forgeAge).find(x=>task===`Forge${x}Equipment`),age=forgeAge[key],it=items.find(x=>x.Age===age&&x.TypeName==='Weapon');
      return it?`<span class="item-art" style="width:${size}px;height:${size}px"><img src="${itemImage(it)}"></span>`:gameIcon('Hammer',size);
    }
    return gameIcon('Battle',size);
  }
  app.innerHTML=title('클랜','클랜전 점수 계산','2.9.0 실제 행동점수·인게임 아이콘·클랜 점수기술을 적용합니다.')+`<div class="metrics" id="warSum"></div><div class="tabs" id="warTabs" style="margin-top:12px">${[1,2,3,4,5].map(d=>`<button class="tab ${d===1?'active':''}" data-day="${d}">${d}일차</button>`).join('')}</div><div id="warTech"></div><div id="warBody"></div>`;
  function renderSum(){let vals=[1,2,3,4,5].map(total);$('#warSum').innerHTML=vals.map((v,i)=>metric(`${i+1}일차`,fmt(v))).join('')+metric('전체',fmt(vals.reduce((a,b)=>a+b,0)),'status-ok')}
  function renderTech(){
    let keys=[...new Set(dayTasks(day).map(x=>x.tech).filter(Boolean)),'WarPointsOnDay'+day];
    $('#warTech').innerHTML=`<section class="panel"><div class="section-head"><h2>적용 클랜 기술</h2><span class="chip">실제 아이콘 · 직접 설정</span></div><div class="tech-grid">${keys.map(k=>{let def=tech[k]||{},l=lv(k),max=n(def.MaxLevel,10),inf=isInf(k),icon=clanMap?.mapping?.[k];return `<div class="tech-card" data-tech="${k}"><div class="comp-head"><span class="sprite" style="${rectAtlasStyle(icon,58)}"></span><div><b>${k.startsWith('WarPointsOnDay')?`${day}일차 전체 점수`:techName(k)}</b><div class="muted small">Lv.${l}${inf?` · 기본 ${max} 이후 ∞`:`/${max}`}</div></div></div><div class="stat-line"><span>점수 증가</span><b>+${fmt(bonus(k)*100)}%</b></div><div class="stat-line"><span>누적 기술포인트</span><b>${fmt(techCost(k))}</b></div><div class="tech-controls"><button data-d="-1">-1</button><button data-d="1">+1</button><button data-d="5">+5</button><button data-d="${inf?'10':'max'}">${inf?'+10':'MAX'}</button></div></div>`}).join('')}</div></section>`
  }
  function renderBody(){

async function renderSubstats(){let p=profile(),[lib,unlock]=await Promise.all([cfg('SecondaryStatLibrary.json'),cfg('SecondaryStatItemUnlockLibrary.json')]);let age=7,mode='damage';const ko={CriticalChance:'치명타 확률',CriticalMulti:'치명타 피해',BlockChance:'막기 확률',HealthRegen:'체력 재생',LifeSteal:'생명력 흡수',DoubleDamageChance:'2배 피해 확률',DamageMulti:'피해 증가',MeleeDamageMulti:'근접 피해',RangedDamageMulti:'원거리 피해',AttackSpeed:'공격속도',SkillDamageMulti:'스킬 피해',SkillCooldownMulti:'스킬 쿨다운',HealthMulti:'체력 증가'};app.innerHTML=title('1vcian','보조옵션 계산','시대별 보조옵션 슬롯 수와 실제 옵션 범위를 이용해 목적별 우선순위를 계산합니다.')+`<section class="panel grid2"><label class="field"><span>장비 시대</span><select id="ssAge">${K.ages.map((x,i)=>`<option value="${i}" ${i===age?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>목표</span><select id="ssMode"><option value="damage">피해</option><option value="survival">생존</option><option value="balanced">균형</option></select></label></section><div id="ssOut"></div>`;function r(){age=+$('#ssAge').value;mode=$('#ssMode').value;let slots=n(unlock[String(age)]?.NumberOfSecondStats),fairy=p.fairy?.name?K.fairy[p.fairy.name]:null,required={Mira:'SkillDamageMulti',Tira:'SkillCooldownMulti',Lora:'HealthMulti'}[p.fairy?.name]||'';let rows=Object.entries(lib).map(([k,v])=>{let dmg=['CriticalChance','CriticalMulti','DoubleDamageChance','DamageMulti','MeleeDamageMulti','RangedDamageMulti','AttackSpeed','SkillDamageMulti'].includes(k),sur=['BlockChance','HealthRegen','LifeSteal','HealthMulti'].includes(k),w=mode==='damage'?(dmg?2:.4):mode==='survival'?(sur?2:.4):(dmg||sur?1.2:.7);if(k===required)w*=1.5;return{k,v,score:n(v.UpperRange)*w}}).sort((a,b)=>b.score-a.score);$('#ssOut').innerHTML=`<div class="metrics">${metric('보조옵션/장비',slots)+metric('추천 1순위',ko[rows[0]?.k]||rows[0]?.k||'-')+metric('선택 요정',p.fairy?.name?K.fairy[p.fairy.name]?.ko:'없음')+metric('요정 연계 옵션',required?ko[required]:'-')}</div><section class="panel"><div class="config-list">${rows.map((x,i)=>`<div class="config-row"><span>${i+1}. ${ko[x.k]||x.k}</span><b>${(n(x.v.LowerRange)*100).toFixed(1)}~${(n(x.v.UpperRange)*100).toFixed(1)}%</b></div>`).join('')}</div></section>`}app.onchange=r;r()}
async function renderConfigs(){let list=['ItemBalancingLibrary.json','AutoItemMapping.json','PetLibrary.json','MountLibrary.json','SkillLibrary.json','FairyUpgradesLibrary.json','GuildWarDayConfigLibrary.json','GuildTechTreeUpgradeLibrary.json','ForgeUpgradeLibrary.json','PlayerTechTreePositionLibrary.json'];app.innerHTML=title('정보','게임 데이터','새 KR판은 1vcian 쪽 최신 공개 게임설정/이미지 매핑을 읽어옵니다.')+`<section class="panel"><div class="metrics">${metric('게임','2.9.0')+metric('데이터 버전',K.VERSION)+metric('이미지','Texture2D 원본')+metric('프로필 저장','localStorage')}</div><div class="config-list" style="margin-top:10px">${list.map(x=>`<div class="config-row"><span>${x}</span><b class="status-ok">연결</b></div>`).join('')}</div></section>`}
async function renderSettings(){let versions=[];try{versions=await cfg('versions.json',true)}catch{};if(!Array.isArray(versions))versions=Object.values(versions||{});versions=versions.map(x=>typeof x==='string'?x:(x.version||x.id||x.name)).filter(Boolean);if(!versions.includes(S.version))versions.unshift(S.version);app.innerHTML=title('설정','설정','빛의 계승자 폰트를 우선 사용하고, 공개 게임데이터 버전을 직접 선택할 수 있습니다.')+`<section class="panel"><div class="grid2"><label class="field"><span>게임 데이터 버전</span><select id="dataVer">${versions.map(x=>`<option ${x===S.version?'selected':''}>${x}</option>`).join('')}</select></label><div class="config-row"><span>UI 폰트</span><b>빛의 계승자 / Heir of Light</b></div></div><div class="config-list" style="margin-top:10px"><div class="config-row"><span>게임 기준</span><b>Forge Master 2.9.0</b></div><div class="config-row"><span>시스템 참조</span><b>1vcian + TechPlanner</b></div><div class="config-row"><span>이미지</span><b>인게임 Texture2D / Sprite 매핑</b></div></div><div class="notice" style="margin-top:10px">업로드한 폰트 파일 자체는 저장소에 재배포하지 않고, 기기에 설치된 ‘빛의 계승자’를 우선 사용합니다.</div><button id="resetNew" class="btn danger" style="width:100%;margin-top:10px">새 KR 저장값 전체 초기화</button></section>`;$('#dataVer').onchange=e=>{S.version=e.target.value;CONFIG_CACHE.clear();save();toast('데이터 버전 변경됨');renderRoute()};$('#resetNew').onclick=()=>{if(confirm('새 KR판 저장값을 전부 초기화할까?')){localStorage.removeItem(STORE);location.reload()}}}
const ROUTES={profile:renderProfile,progress:renderProgress,compare:renderCompare,pvp:renderPvp,planner:renderPlanner,gem:renderGem,eggplan:renderEggPlanner,daily:renderDaily,weekly:renderWeekly,forge:renderForge,offline:renderOffline,dungeons:renderDungeons,summon:renderSummon,tech:renderTech,war:renderWar,optimize:renderOptimize,substats:renderSubstats,items:renderItems,pets:renderPets,skills:renderSkills,mounts:renderMounts,fairies:renderFairies,skins:renderSkins,arena:renderArena,unlocks:renderUnlocks,configs:renderConfigs,settings:renderSettings};

initNav();updateProfileChip();const shared=new URLSearchParams(location.search).get('fmprofile');if(shared){try{let raw=shared.replace(/-/g,'+').replace(/_/g,'/'),pad='='.repeat((4-raw.length%4)%4),x=JSON.parse(decodeURIComponent(escape(atob(raw+pad))));x.id=uid();x.name=(x.name||'공유 프로필')+' · 공유';S.profiles.push(x);S.activeId=x.id;save();history.replaceState(null,'',location.pathname+'#/profile')}catch(e){console.warn('share import failed',e)}}window.addEventListener('hashchange',renderRoute);renderRoute();
