function activeRoute(){return(location.hash||'#/profile').replace(/^#\//,'').split('?')[0]||'profile'}

function spriteStyle(index,kind,asc=0,size=76){let specs={pets:[8,2048,2048,'Pets.png','MegaPets.png','UltraPets.png','ApexPets.png'],skills:[8,2048,2048,'SkillIcons.png','MegaSkillIcons.png','UltraSkillIcons.png','ApexSkillIcons.png'],mounts:[4,1024,1024,'MountIcons.png','MegaMountIcons.png','UltraMountIcons.png','ApexMountIcons.png']}[kind];if(!specs||index<0)return'';let[cols,sw,sh,...files]=specs,row=Math.floor(index/cols),col=index%cols,cell=256,scale=size/cell;return `width:${size}px;height:${size}px;background-image:url('${asset(files[Math.max(0,Math.min(3,asc))])}');background-position:-${col*cell*scale}px -${row*cell*scale}px;background-size:${sw*scale}px ${sh*scale}px`}
function sentence(s){return String(s||'').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ')}
function itemImage(map){return map?.SpriteName?asset(map.SpriteName+'.png'):''}
function itemKoName(map){return sentence(map?.ItemName||`${map?.TypeName||'장비'} ${Number(map?.Idx||0)+1}`)}
function rarityChip(r){return `<span class="chip rarity" style="color:${K.rarityColor[r]||'#fff'}">${K.rarityKo[r]||r}</span>`}
function compSprite(info,kind,asc=0,size=76){return `<span class="comp-sprite sprite" style="${spriteStyle(info.spriteIndex,kind,asc,size)}"></span>`}
async function mappingLookups(){let m=await cfg('ManualSpriteMapping.json',true);let out={pets:{},mounts:{},skills:{}};for(const kind of ['pets','mounts'])for(const[idx,x]of Object.entries(m[kind]?.mapping||{}))out[kind][`${x.rarity}_${x.id}`]={...x,spriteIndex:+idx};for(const[idx,x]of Object.entries(m.skills?.mapping||{}))out.skills[x.name]={...x,spriteIndex:+idx};return out}
async function allItems(){let m=await cfg('AutoItemMapping.json',true);return Object.values(m).filter(x=>x.Age>=0&&x.Age<10)}
function equipStatsFromLib(lib,slot){if(!slot)return[];let key=`{'Age': ${slot.age}, 'Type': '${slot.type}', 'Idx': ${slot.idx}}`,row=lib[key];return row?.EquipmentStats||[]}
function levelScale(v,l){return n(v)*Math.pow(1.01,Math.max(0,n(l,1)-1))}
function equipmentSummary(lib,p){let dmg=0,hp=0;for(const s of Object.values(p.equipment)){for(const st of equipStatsFromLib(lib,s)){let type=st.StatNode?.UniqueStat?.StatType,val=levelScale(st.Value,s?.level||1);if(type==='Damage')dmg+=val;if(type==='Health')hp+=val}}return{dmg,hp}}
