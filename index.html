function equipBase(age,slot){return ['Weapon','Gloves','Necklace','Ring'].includes(slot)?5*Math.pow(4,age):40*Math.pow(4,age)}
function equipStat(age,slot,level,idx){let scale=Math.pow(1.01,Math.max(0,n(level,1)-1)),mastery=1+sumKind(MASTERY_KIND[slot]||'')/100,val=equipBase(age,slot)*scale*forgeAscMulti()*mastery,damage=['Weapon','Gloves','Necklace','Ring'].includes(slot)?val:0,health=['Weapon','Gloves','Necklace','Ring'].includes(slot)?0:val;if(slot==='Weapon'&&HYBRID_WEAPON[`${age}:${idx}`])health=40*Math.pow(4,age)*scale*forgeAscMulti()*(1+sumKind('weaponMastery')/100);return{damage,health}}
function equipSlotConfig(slot){let c=S.equipment?.slotConfig?.[slot];if(!c){c={age:n(S.equipment?.age,S.age),idx:n(S.equipment?.slots?.[slot]),level:Math.max(1,n(S.equipment?.level,1)),secondaryStats:[],equipped:false};S.equipment.slotConfig[slot]=c}return c}
function equipItemName(slot,cfg=equipSlotConfig(slot)){let names=EQUIP_NAMES[cfg.age]?.[slot]||[];return names[cfg.idx]||`${SLOT_META[slot]?.[0]||slot} ${n(cfg.idx)+1}`}
function equipItemFile(slot,cfg=equipSlotConfig(slot)){return (EQUIP_FILE[cfg.age]?.[slot]||[])[cfg.idx]||''}
function equipItemImage(slot,cfg=equipSlotConfig(slot)){let f=equipItemFile(slot,cfg);return f?`assets/items/${f}`:`assets/age_${cfg.age}.webp`}
function equipTotals(){let damage=0,health=0,items=[];for(const slot of PROFILE_SLOT_ORDER){let cfg=equipSlotConfig(slot);if(cfg.equipped===false){items.push({slot,empty:true,damage:0,health:0,age:cfg.age,level:cfg.level,idx:cfg.idx,name:'비어 있음',secondaryStats:[]});continue}let files=EQUIP_FILE[cfg.age]?.[slot]||[];let idx=Math.max(0,Math.min(Math.max(0,files.length-1),n(cfg.idx))),st=equipStat(cfg.age,slot,cfg.level,idx);damage+=st.damage;health+=st.health;items.push({slot,idx,age:cfg.age,level:cfg.level,name:equipItemName(slot,{...cfg,idx}),secondaryStats:cfg.secondaryStats||[],...st})}let wc=equipSlotConfig('Weapon'),w=wc.equipped===false?null:D.weapons.find(x=>x.age===wc.age&&x.idx===wc.idx),attackSpeed=items.reduce((sum,it)=>sum+(it.secondaryStats||[]).filter(x=>x?.type==='AttackSpeed').reduce((a,x)=>a+n(x.value),0),0),weaponAttackSpeed=(items.find(it=>it.slot==='Weapon')?.secondaryStats||[]).filter(x=>x?.type==='AttackSpeed').reduce((a,x)=>a+n(x.value),0);return{age:wc.age,level:wc.level,damage,health,attackSpeed,weaponAttackSpeed,weaponInterval:w?n(w.attackDuration,0):0,weaponWindup:w?n(w.windup,0):0,items}}
const SKIN_SLOT_LABEL={Weapon:'무기',Helmet:'투구',Armour:'갑옷'};
function skinSetInfo(name=''){return SKIN_SET_DATA[name]||{id:'',pieces:0,damage:0,health:0}}
function skinActiveInfo(){let counts={};for(const slot of ['Weapon','Helmet','Armour']){let name=S.skinSlots?.[slot]||'';if(name)counts[name]=(counts[name]||0)+1}let activeName='';for(const [name,count] of Object.entries(counts)){let info=skinSetInfo(name);if(info.pieces&&count>=info.pieces){activeName=name;break}}let active=skinSetInfo(activeName);return{counts,activeName,active,slotText:['Weapon','Helmet','Armour'].map(slot=>`${SKIN_SLOT_LABEL[slot]}:${S.skinSlots?.[slot]||'없음'}`).join(' · ')}}
function skinApplied(){let info=skinActiveInfo(),full=!!info.activeName,slotDamage=0,slotHealth=0;for(const slot of ['Weapon','Helmet','Armour']){if(!S.skinSlots?.[slot])continue;let stat=S.skinStats?.[slot]||{},value=Math.max(0,Math.min(12,n(stat.value)));if(stat.type==='Damage')slotDamage+=value;else if(stat.type==='Health')slotHealth+=value}return{full,damage:n(S.skinDamagePct)+slotDamage+(full?info.active.damage:0),health:n(S.skinHealthPct)+slotHealth+(full?info.active.health:0),slotDamage,slotHealth,set:info.active,activeName:info.activeName,slotText:info.slotText,counts:info.counts}}
const equipTotalsWithoutSkinTiming=equipTotals;
equipTotals=function(){let out=equipTotalsWithoutSkinTiming(),skinName=S.skinSlots?.Weapon||'',timing=skinWeaponTiming(skinName)?.melee;if(timing){out.equipmentWeaponInterval=out.weaponInterval;out.equipmentWeaponWindup=out.weaponWindup;out.weaponInterval=n(timing.duration,out.weaponInterval||1.5);out.weaponWindup=n(timing.windup,out.weaponWindup);out.weaponTimingSource='스킨';out.weaponTimingName=skinName}else{out.weaponTimingSource='장비';out.weaponTimingName=(out.items||[]).find(x=>x.slot==='Weapon'&&!x.empty)?.name||'기본값'}return out};

function openSkinSelector(slot,onChanged){
 let current=S.skinSlots?.[slot]||'',search='';
 const backdrop=document.createElement('div');
 backdrop.className='skin-picker-backdrop';
 backdrop.innerHTML=`<div class="skin-picker-modal" role="dialog" aria-modal="true">
  <div class="skin-picker-head"><div><small>장비에서 바로 장착</small><h2>${SKIN_SLOT_LABEL[slot]||slot} 스킨</h2></div><button type="button" data-skin-picker-close>×</button></div>

 function render(){
  let names=(D.skins||[]).filter(name=>skinAllowedForSlot(name,slot)).filter(name=>!search||name.toLowerCase().includes(search.toLowerCase()));
  backdrop.querySelector('.skin-picker-grid').innerHTML=`<button type="button" class="skin-picker-choice no-skin ${!current?'active':''}" data-skin-pick="">
   <div class="skin-picker-thumb"><span>×</span></div><b>스킨 없음</b><small>${SKIN_SLOT_LABEL[slot]} 스킨 해제</small>
  </button>`+names.map(name=>{
   let d=SKIN_SET_DATA[name]||'';
   return `<button type="button" class="skin-picker-choice ${current===name?'active':''}" data-skin-pick="${esc(name)}">
    <div class="skin-picker-thumb">${v52ProfileSkinIcon(name,slot,'v52-profile-picker-piece')}</div>

   </button>`
  }).join('')
 }
 backdrop.addEventListener('click',ev=>{
  if(ev.target===backdrop||ev.target.closest('[data-skin-picker-close]')){close();return}

  syncSkinLegacy();save();onChanged?.();v52RefreshProfileSkins();close()
 });

 let e=$('#dungeons');
 e.innerHTML=title('던전','던전 1-1부터 마지막 단계까지','2.8.2 던전 기본 보상을 단계별로 계산하고, 내 기술 트리의 던전 보상 증가를 최종 획득량에 자동 적용합니다.')+
 `<div class="toolbar"><select id="dgType">${Object.entries(D.dungeons).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select><input id="dgSearch" placeholder="단계 검색 예: 24-7"></div>
  <div class="panel dungeon-profile-panel"><div id="dgProfileInfo"></div></div>
  <div class="panel"><div class="dungeon-list" id="dgRows"></div></div>`;
 function r(){
  let type=$('#dgType').value,q=$('#dgSearch').value.trim(),keyType=DUNGEON_KEY_MAP[type],keyCount=Math.max(0,n(S.dungeonKeyCounts?.[keyType]));
  let x=D.dungeons[type],bonusBits=x.currencies.map(c=>({c,b:dungeonTechBonus(type,c)}));
  $('#dgProfileInfo').innerHTML=`<div class="dungeon-keybox"><div><small>보유 ${esc(x.name)} 열쇠</small><b>${fmt(keyCount)}</b></div><label><span>열쇠 수량</span><input id="dgKeyCount" type="number" min="0" step="1" inputmode="numeric" value="${keyCount}"></label></div>
   <div class="dungeon-tech-note">${bonusBits.some(z=>z.b!==0)?`현재 기술 적용 · ${bonusBits.map(z=>`${CURRENCY[z.c]||z.c} +${fmt(z.b)}%`).join(' · ')}`:`현재 기술 보너스 · ${bonusBits.map(z=>`${CURRENCY[z.c]||z.c} +0%`).join(' · ')||'적용 대상 없음'}`}</div>`;
  $('#dgKeyCount').addEventListener('input',ev=>{let v=Math.max(0,Math.floor(n(ev.target.value)));S.dungeonKeyCounts[keyType]=v;save()});
  $('#dgKeyCount').addEventListener('change',ev=>{let v=Math.max(0,Math.floor(n(ev.target.value)));ev.target.value=v;S.dungeonKeyCounts[keyType]=v;save()});
  let rows=[];
  for(let lv=0;lv<=D.dungeonMaxLevel;lv++){
   let label=stageLabel(lv);if(q&&!label.includes(q))continue;
   let base=dungeonBaseReward(type,lv),rw=dungeonReward(type,lv);
   let rewardText=Object.entries(rw).map(([k,v])=>{
    let b=n(base[k]),changed=v!==b;
    return `<span class="dungeon-reward${changed?' boosted':''}"><b>${CURRENCY[k]||k} ${fmt(v)}</b>${changed?`<small>기본 ${fmt(b)}</small>`:''}</span>`
   }).join('');
   rows.push(`<div class="dungeon-row"><b>${label}</b><span class="dungeon-reward-wrap">${rewardText}</span></div>`)
  }
  $('#dgRows').innerHTML=rows.join('')||'<div class="empty">검색 결과 없음</div>'
 }
 e.oninput=ev=>{if(ev.target.id!=='dgKeyCount')r()};
 e.onchange=ev=>{if(ev.target.id!=='dgKeyCount')r()};
 r()
}

 e.innerHTML=`<div class="clan-source-note"><b>게임 2.8.2 실제 클랜 임무 설정</b><br>임무 레벨은 1~60이며, 레벨 60의 망치 도둑 진행 기준은 <b>40-10</b>입니다. <strong>클랜 임무 등급색은 APK 2.8.2의 실제 레벨 색상 로직을 적용합니다. 1~10 회색 · 11~20 파랑 · 21~30 초록 · 31~40 금색 · 41~50 빨강 · 51~60 전용 보라색이며, 색상은 보상이 아니라 임무 레벨 카드 자체에 표시합니다. 아래 6개는 합산 보상이 아닙니다.</strong></div><div class="clan-mission-summary">${metric('임무 레벨','1 ~ 60')+metric('망치 도둑 마지막','40-10')+metric('개별 보상 항목','360개')+metric('레벨당 보상','6개')}</div><div class="clan-tech-bonus"><span>⚔️ 미션 피해 +${fmt(dmg*100)}%</span><span>❤️ 미션 체력 +${fmt(hp*100)}%</span><span>🎁 미션 보상 +${fmt(rw*100)}%</span><span>🏰 미션 클랜 포션 +${fmt(gp*100)}%</span></div><div class="clan-mission-toolbar"><input id="clanMissionSearch" inputmode="numeric" placeholder="임무 레벨 · 망치 도둑 단계 · 보상 검색 (예: 1 / 40-10 / 망치)"><select id="clanMissionRange"><option value="all">전체 1~60</option>${[1,11,21,31,41,51].map(a=>`<option value="${a}">${a}~${Math.min(a+9,60)}레벨</option>`).join('')}</select></div><div id="clanMissionRows" class="clan-mission-list"></div>`;
 function render(){let q=$('#clanMissionSearch').value.trim().toLowerCase(),range=$('#clanMissionRange').value;let arr=CLAN_MISSION_DATA.filter(x=>{let st=stageLabel(x.unlockIndex),rr=clanMissionLevelRarity(x.level);let rewardHit=x.rewards.some(r=>(CURRENCY[r.kind]||r.kind).toLowerCase().includes(q));let ok=!q||String(x.level).includes(q)||st.includes(q)||rr.name.toLowerCase().includes(q)||rewardHit;if(range!=='all'){let a=+range;ok=ok&&x.level>=a&&x.level<=a+9}return ok});$('#clanMissionRows').innerHTML=arr.map(x=>{let stage=stageLabel(x.unlockIndex),last=x.level===60,rr=clanMissionLevelRarity(x.level);return `<article class="clan-mission-row" style="--mission-rarity:${rr.color}" data-mission-grade="${rr.name}" data-game-color="${rr.gameColor}" title="${rr.gameColor} · ${rr.color}"><div class="clan-mission-row-head"><div class="clan-mission-title"><b>클랜 임무 Lv.${x.level}</b><span class="clan-mission-grade">${rr.name}</span></div><span class="clan-mission-stage ${last?'clan-last-badge':''}">망치 도둑 ${stage}${last?' · 마지막':''}</span></div><div class="clan-mission-rewards">${x.rewards.map(r=>`<div class="clan-mission-reward"><small>${clanMissionCurrencyIcon(r.kind)} ${CURRENCY[r.kind]||r.kind}</small><b>${fmt(r.amount)}</b></div>`).join('')}</div><div class="clan-reward-note"><strong>합계가 아님</strong> · Lv.${x.level}에서 보상 종류에 따라 위 값 중 해당 보상이 적용됩니다.</div></article>`}).join('')||'<div class="empty">검색 결과 없음</div>'}
 $('#clanMissionSearch').addEventListener('input',render);$('#clanMissionRange').addEventListener('change',render);render();
}

function forgePathCalc(fromAsc,fromLv,toAsc,toLv){fromAsc=Math.max(0,Math.min(3,n(fromAsc)));fromLv=Math.max(1,Math.min(35,n(fromLv)));toAsc=Math.max(fromAsc,Math.min(3,n(toAsc)));toLv=Math.max(1,Math.min(35,n(toLv)));if(toAsc===fromAsc&&toLv<fromLv)toLv=fromLv;let disc=Math.min(.95,sumKind('forgeCost')/100),speed=Math.max(0,sumKind('forgeTime')/100),cost=0,sec=0,steps=[],a=fromAsc,l=fromLv,guard=0;while((a<toAsc||(a===toAsc&&l<toLv))&&guard++<300){if(l>=35){if(a>=3)break;cost+=3000000;steps.push({label:`승천 ${a} → ${a+1}`,cost:3000000,sec:0});a++;l=1;continue}let row=D.forge.find(x=>x.from===l);if(!row)break;let c=Math.round(n(row.cost)*(1-disc)),s=n(row.seconds)/(1+speed);cost+=c;sec+=s;steps.push({label:`승천 ${a} · Lv.${l} → ${l+1}`,cost:c,sec:s});l++}return{cost,sec,steps,toAsc:a,toLv:l}}

<script id="v42-km-inputs">
(function(){
  function parseKM(v){
    if(typeof v==='number') return Number.isFinite(v)?v:0;
    const s=String(v??'').trim().replace(/,/g,'');
    const m=s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\s*([kKmM])?$/);
    if(!m) return Number.isFinite(+s)?+s:0;
    const unit=(m[2]||'').toLowerCase();
    const mul=unit==='k'?1000:unit==='m'?1000000:1;
    const value=Number(m[1])*mul;
    return Number.isFinite(value)?value:0;
  }
  window.fmParseKM=parseKM;
  function enhance(root){
    (root||document).querySelectorAll?.('input[data-km-input]').forEach(el=>{
      if(el.dataset.kmReady)return;
      el.dataset.kmReady='1';
      el.title='k, m 입력 가능 · 예: 1.5k = 1,500 / 2m = 2,000,000';
      el.addEventListener('blur',()=>{
        const raw=el.value.trim();
        if(!raw)return;
        const value=Math.max(0,parseKM(raw));
        if(!Number.isFinite(value))return;
        // Preserve compact notation if it was valid; only repair invalid/negative values.
        if(value===0 && !/^0+(?:\.0+)?\s*[kKmM]?$/.test(raw)) el.value='0';
        else if(/^\s*-/.test(raw)) el.value=String(value);
      });
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>enhance(document));else enhance(document);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches?.('input[data-km-input]'))enhance(n.parentNode);else enhance(n)}}))).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script id="v53-suite">
(function(){
const C=window.FM_V53_CORE,D=C.D,S=C.S,$=s=>document.querySelector(s),F=C.fmt,K='forgeMasterV53Suite2';let X;try{X=JSON.parse(localStorage.getItem(K)||localStorage.getItem('forgeMasterV53Suite')||'{}')}catch(_){X={}};X.queue??=[];X.profiles??=[];X.income??={daily:0,dungeon:0,clan:0,war:0,mission:0,shop:0};X.egg??={rarity:'일반',count:1,slots:2,reduction:0};let active='dashboard';const save=()=>localStorage.setItem(K,JSON.stringify(X)),R=['일반','희귀','에픽','전설','궁극','신화'];
const tabs=[['dashboard','현황'],['research','연구 일정'],['economy','수입·젬'],['growth','알·성장'],['combat','전투 분석'],['builds','프로필·공유'],['data','데이터']];
function field(label,key,value,type='number',extra=''){return `<label class="v53-row"><span>${label}</span><input type="${type}" data-x="${key}" value="${value??0}" ${extra}></label>`}function set(id,v){let e=$('#'+id);if(e)e.innerHTML=v}function profile(){try{return C.profileAggregate()}catch(_){return{damage:0,health:0,petD:0,petH:0,mountD:0,mountH:0,skillD:0,eq:{damage:0,health:0}}}}function pct(v){return Number(v||0).toFixed(1)+'%'}
function init(){let e=$('#v53tools');e.innerHTML=`<div class="pagehead"><div><span class="eyebrow">V53 FULL SUITE · LIVE DATA</span><h1>종합 도구</h1><p>내 설정과 기술 트리를 직접 읽는 통합 계획·분석 화면입니다.</p></div></div><div class="v53-tabs">${tabs.map(([id,n],i)=>`<button data-vtab="${id}" class="${i?'':'on'}">${n}</button>`).join('')}</div><div id="v53body"></div>`;e.querySelector('.v53-tabs').onclick=ev=>{let b=ev.target.closest('[data-vtab]');if(!b)return;active=b.dataset.vtab;e.querySelectorAll('[data-vtab]').forEach(x=>x.classList.toggle('on',x===b));render()};render()}
function dashboard(){let p=profile(),tc=C.totalTreeCost();return `<div class="v53-grid"><div class="v53-card v53-hero"><span class="eyebrow">현재 캐릭터</span><h2>${C.esc(S.name||'내 캐릭터')}</h2><div class="metric-grid">${C.metric('종합 피해',F(p.damage))+C.metric('종합 체력',F(p.health))+C.metric('장비 피해',F(p.eq?.damage))+C.metric('장비 체력',F(p.eq?.health))}</div></div><div class="v53-card"><h3>시스템 기여도</h3><div class="metric-grid">${C.metric('펫 피해/체력',`${F(p.petD)} / ${F(p.petH)}`)+C.metric('탈것 피해/체력',`${F(p.mountD)} / ${F(p.mountH)}`)+C.metric('스킬 피해',F(p.skillD))+C.metric('활성 스킨',p.sk?.activeName||'없음')}</div></div><div class="v53-card"><h3>기술 투자 현황</h3><div class="metric-grid">${C.metric('누적 포션',F(tc.pot))+C.metric('누적 연구시간',C.time(tc.sec))+C.metric('대기열',X.queue.length+'개')+C.metric('데이터 기준',D.meta.dataStamp)}</div><div class="v53-actions"><button class="v53-btn" data-go="research">연구 계획 열기</button><button class="v53-btn" data-go="combat">전투 분석 열기</button></div></div><div class="v53-card"><h3>승천 현황</h3><div class="metric-grid">${['Forge','Skills','Pets','Mounts'].map(k=>C.metric({Forge:'대장간',Skills:'스킬',Pets:'펫',Mounts:'탈것'}[k],S.asc[k]?`★${S.asc[k]}`:'기본')).join('')}</div></div></div>`}
function researchCost(tree,tier,id,target){let node=D.techTemplates[tree].nodes.find(x=>x.id===id),cur=C.treeLevel(tree,tier,id),pot=0,sec=0;for(let lv=cur;lv<Math.min(target,node.max);lv++){pot+=D.tierPotionCosts[tier][Math.min(lv,4)];sec+=D.tierTimes[tier][Math.min(lv,4)]*60}return{node,cur,target:Math.min(target,node.max),pot,sec}}
function research(){let tree=X.rTree||'forge',tier=+X.rTier||1,nodes=D.techTemplates[tree].nodes,id=X.rNode||nodes[0].id;if(!nodes.some(x=>x.id===id))id=nodes[0].id;let node=nodes.find(x=>x.id===id),target=Math.max(C.treeLevel(tree,tier,id),Math.min(node.max,+X.rTarget||node.max)),qSec=X.queue.reduce((a,x)=>a+x.sec,0),qPot=X.queue.reduce((a,x)=>a+x.pot,0),cursor=Date.now();return `<div class="v53-grid"><div class="v53-card"><h3>실제 기술 추가</h3><label class="v53-row"><span>기술 트리</span><select data-x="rTree"><option value="forge" ${tree==='forge'?'selected':''}>대장간</option><option value="spt" ${tree==='spt'?'selected':''}>스킬·펫</option><option value="power" ${tree==='power'?'selected':''}>파워</option></select></label><label class="v53-row"><span>티어</span><select data-x="rTier">${[1,2,3,4,5].map(v=>`<option ${v===tier?'selected':''}>${v}</option>`).join('')}</select></label><label class="v53-row"><span>기술</span><select data-x="rNode">${nodes.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${C.esc(x.name)}</option>`).join('')}</select></label>${field('목표 레벨','rTarget',target,'number',`min="${C.treeLevel(tree,tier,id)}" max="${node.max}"`)}<div id="rPreview" class="v53-result"></div><button class="v53-btn" id="rAdd">대기열에 추가</button></div><div class="v53-card"><h3>일정 합계</h3><div class="v53-result"><b>${F(X.queue.length)}개 연구</b><br>기술 포션 ${F(qPot)}개<br>총 ${C.time(qSec)}<br>완료 ${new Date(Date.now()+qSec*1000).toLocaleString('ko-KR')}</div><div class="v53-actions"><button class="v53-btn" id="rApply">전체 레벨 적용</button><button class="v53-btn" id="rClear">대기열 비우기</button></div></div><div class="v53-card v53-wide"><h3>연구 대기열</h3><div class="v53-list">${X.queue.map((q,i)=>{cursor+=q.sec*1000;return `<div class="v53-item"><div><span class="v53-index">${i+1}</span><b>${C.esc(q.name)}</b><small>T${q.tier} · Lv.${q.from}→${q.target} · ${F(q.pot)}포션 · ${C.time(q.sec)}<br>${new Date(cursor).toLocaleString('ko-KR')} 완료</small></div><div><button class="v53-btn" data-qup="${i}">↑</button><button class="v53-btn" data-qdown="${i}">↓</button><button class="v53-btn danger" data-qdel="${i}">×</button></div></div>`}).join('')||'<div class="v53-empty-state">기술을 선택해 계획에 추가하세요.</div>'}</div></div></div>`}
function economy(){let w=X.income,total=(+w.daily||0)*7+(+w.dungeon||0)*7+(+w.clan||0)+(+w.war||0)+(+w.mission||0)+(+w.shop||0),goal=+X.gemGoal||0,have=+X.gemHave||0,daily=+X.gemDaily||0,lack=Math.max(0,goal-have);return `<div class="v53-grid"><div class="v53-card"><h3>주간 수입</h3>${field('일일 기본','income.daily',w.daily)}${field('일일 던전','income.dungeon',w.dungeon)}${field('클랜 주간','income.clan',w.clan)}${field('클랜 전쟁','income.war',w.war)}${field('임무','income.mission',w.mission)}${field('상점·기타','income.shop',w.shop)}<div class="v53-result">주간 합계 <b>${F(total)}</b><br>일평균 <b>${F(total/7)}</b></div></div><div class="v53-card"><h3>목표 젬</h3>${field('현재 젬','gemHave',have)}${field('목표 젬','gemGoal',goal)}${field('하루 획득 젬','gemDaily',daily)}<div class="v53-result">부족 <b>${F(lack)}젬</b><br>${daily>0?`약 <b>${Math.ceil(lack/daily)}일</b> · ${new Date(Date.now()+Math.ceil(lack/daily)*864e5).toLocaleDateString('ko-KR')}`:'하루 획득량을 입력하세요.'}</div></div></div>`}

function combat(){let p=profile(),eq=p.eq||{},interval=Math.max(.05,(S.useWeaponTiming&&eq.weaponInterval?eq.weaponInterval:C.n(S.attackInterval,1.5))/(1+(C.n(S.attackSpeed)+C.n(eq.attackSpeed))/100)),crit=1+Math.min(1,C.n(S.critChance)/100)*C.n(S.critDamage)/100,dps=p.damage*crit/interval;let parts=[['장비',eq.damage||0],['펫',p.petD||0],['탈것',p.mountD||0],['스킬',p.skillD||0]],max=Math.max(1,...parts.map(x=>x[1]));return `<div class="v53-grid"><div class="v53-card"><h3>현재 DPS</h3><div class="v53-big-number">${F(dps)}</div><div class="metric-grid">${C.metric('총 피해',F(p.damage))+C.metric('공격주기',interval.toFixed(3)+'초')+C.metric('치명타 확률',pct(S.critChance))+C.metric('치명타 피해',pct(S.critDamage))}</div></div><div class="v53-card"><h3>피해 구성</h3>${parts.map(([n,v])=>`<div class="v53-break"><span>${n}<b>${F(v)}</b></span><div class="v53-bar"><i style="width:${v/max*100}%"></i></div></div>`).join('')}</div><div class="v53-card v53-wide"><h3>현재 장착 요약</h3><div class="metric-grid">${C.metric('장비',`${eq.items?.filter(x=>!x.empty).length||0}/8`)+C.metric('펫',`${S.petSlots.filter(Boolean).length}/3`)+C.metric('스킬',`${S.skillSlots.filter(Boolean).length}/3`)+C.metric('탈것',S.mountSlot?.name||'없음')+C.metric('스킨 세트',p.sk?.activeName||'없음')+C.metric('파워 기술',F(p.power))}</div><p class="v53-note">수치는 ‘내 설정’을 변경하면 이 화면을 다시 열 때 즉시 갱신됩니다.</p></div></div>`}
function builds(){return `<div class="v53-grid"><div class="v53-card"><h3>현재 설정 저장</h3><input id="buildName" class="v53-name" placeholder="프로필 이름"><div class="v53-actions"><button class="v53-btn" id="buildSave">새 프로필 저장</button><button class="v53-btn" id="buildExport">전체 내보내기</button><button class="v53-btn" id="buildImport">가져오기</button><button class="v53-btn" id="buildShare">공유 URL 복사</button></div><p class="v53-note">내 설정 전체와 V53 계획을 함께 저장합니다.</p><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>스크린샷 확인</h3><input id="v53Shot" type="file" accept="image/*"><div id="v53ShotOut" class="v53-note">이미지를 선택하면 이 기기에서 바로 미리보기합니다.</div></div><div class="v53-card"><h3>저장된 프로필</h3><div class="v53-list">${X.profiles.map((p,i)=>`<div class="v53-item"><div><b>${C.esc(p.name)}</b><small>${new Date(p.at).toLocaleString('ko-KR')}</small></div><div><button class="v53-btn" data-bload="${i}">불러오기</button><button class="v53-btn" data-bclone="${i}">복제</button><button class="v53-btn danger" data-bdel="${i}">×</button></div></div>`).join('')||'<div class="v53-empty-state">저장된 프로필이 없습니다.</div>'}</div></div></div>`}

function growthV336(){let e=X.egg,ed=D.eggData[e.rarity]||D.eggData['일반'],waves=Math.ceil(Math.max(0,+e.count||0)/Math.max(1,+e.slots||1)),playerSpeed=C.sumKind(ed.kind),clanKey={일반:'CommonEggTimer',희귀:'RareEggTimer',에픽:'EpicEggTimer',전설:'LegendaryEggTimer',궁극:'UltimateEggTimer',신화:'MythicEggTimer'}[e.rarity],clanSpeed=C.clanBonus(clanKey)*100,totalSpeed=playerSpeed+clanSpeed,baseMins=waves*ed.minutes,mins=baseMins/(1+totalSpeed/100),pet=X.gPet||'판다',mount=X.gMount||'수련잎',pl=Math.max(1,Math.min(100,+X.gPetLv||1)),ml=Math.max(1,Math.min(100,+X.gMountLv||1)),pa=Math.max(0,Math.min(3,+X.gPetAsc||0)),ma=Math.max(0,Math.min(3,+X.gMountAsc||0)),pi=C.petInfo(pet),mi=C.mountInfo(mount),pm=pa?1+C.n(D.ascension.Pets.mult[pa-1]):1,mm=ma?1+C.n(D.ascension.Mounts.mult[ma-1]):1;return `<div class="v53-grid"><div class="v53-card"><h3>알 부화 일정</h3><label class="v53-row"><span>등급</span><select data-x="egg.rarity">${R.map(r=>`<option ${r===e.rarity?'selected':''}>${r}</option>`).join('')}</select></label>${field('알 개수','egg.count',e.count)}${field('부화 슬롯','egg.slots',e.slots,'number','min="1" max="4"')}<div class="v53-result">기본 ${C.time(baseMins*60)} · 기술 속도 <b>+${F(totalSpeed)}%</b><br><small>개인 기술 +${F(playerSpeed)}% · 클랜 기술 +${F(clanSpeed)}%</small><br>${waves}회전 · 적용 시간 <b>${C.time(mins*60)}</b><br>${new Date(Date.now()+mins*60000).toLocaleString('ko-KR')} 완료<br>전쟁 점수 ${F((+e.count||0)*ed.points)}</div></div><div class="v53-card"><h3>펫 성장 미리보기</h3><label class="v53-row"><span>펫</span><select data-x="gPet">${D.pets.map(x=>`<option ${x.name===pet?'selected':''}>${C.esc(x.name)}</option>`).join('')}</select></label>${field('레벨','gPetLv',pl,'number','min="1" max="100"')}${field('승천','gPetAsc',pa,'number','min="0" max="3"')}<div class="v53-result">${C.esc(pi.rarity)} · 피해 <b>${F(pi.stats[0]*(1+(pl-1)*.1)*pm)}</b><br>체력 <b>${F(pi.stats[1]*(1+(pl-1)*.1)*pm)}</b></div></div><div class="v53-card"><h3>탈것 성장 미리보기</h3><label class="v53-row"><span>탈것</span><select data-x="gMount">${D.mounts.m
